# S1-R4: isolated hard-case curriculum for not_found/not_checked_due_to_ik.
# Keep this bucket separate from candidate-path terminal repair.
includes:
  - s1_r3_candidate_repair_base.yaml

sac:
  # R4 resumes from a partially trained actor/critic state on a tighter GPU budget.
  # Halve the batch to avoid the first critic-update OOM without breaking checkpoint compatibility.
  batch_size: 128

train:
  focused_reset_seed_manifest: configs/experiments/reaching_incremental/manifests/s1_r4_hard_case_failure_v1.json
  focused_reset_fraction: 0.45
  focused_reset_jitter:
    enabled: true
    joint_noise_range_rad: 0.03
    goal_radius_m: 0.03
    obstacle_radius_m: 0.04
