includes:
  - s1_static_terminal_repaired_finetune_base.yaml

sac:
  actor_lr: 0.000005
  critic_lr: 0.0001
  alpha_lr: 0.000005
  replay_stratified_fraction: 0.60
  resume_replay_warmup_steps: 20000
  resume_critic_warmup_steps: 20000
  actor_anchor_weight: 0.0
  fixed_risk_penalty: 2.0

reward:
  terminal_goal_radius_m: 0.12
  w_terminal_progress: 30.0

train:
  method: link_fixed
  save_interval: 10000
  save_replay: true
  save_step_replay: false
  focused_reset_seed_manifest: configs/experiments/reaching_incremental/manifests/s1_r4_static_candidate_failure_union_v1.json
  focused_reset_fraction: 0.30
  focused_reset_jitter:
    enabled: true
    joint_noise_range_rad: 0.03
    goal_radius_m: 0.025
    obstacle_radius_m: 0.04

env:
  obstacle:
    enabled: true
    scenario: random
    speed_range: [0.0, 0.0]
  residual_control:
    enabled: true
    residual_scale: 0.30
    base_speed_scale: 1.0
    terminal_goal_radius_m: 0.12
    terminal_gain: 3.0
    waypoint_gain: 2.0
    damping: 0.05
    clearance_margin_m: 0.03
    waypoint_lateral_margin_m: 0.08
    waypoint_height_offset_m: 0.0
  safety_filter:
    enabled: false
    viability_monitor_enabled: false
    diagnostic_logging: false
    recovery_mode_enabled: false
    recovery_allow_constraint_relaxation: false
    recovery_maximize_min_clearance: false
