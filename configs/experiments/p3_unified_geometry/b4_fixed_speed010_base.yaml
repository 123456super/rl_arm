# P3 canonical B4 condition. Train and evaluation use the same final geometry,
# safety envelope, action constraints, and one fixed obstacle speed.
# Timing budgets are intentionally disabled for this offline feasibility run.
includes:
  - ../../default.yaml

risk:
  representation: predictive

sac:
  fixed_risk_penalty: 1.0

env:
  collision:
    termination: physical_contact
  # Freeze the policy action limit and task workspace with the safety constraints.
  action_scale: 0.7
  workspace:
    x: [0.25, 0.78]
    y: [-0.45, 0.45]
    z: [0.18, 0.78]
  safety_filter:
    enabled: true
    prediction_horizon_s: 0.15
    max_observation_age_s: 0.10
    control_delay_s: 0.0
    geometry_margin_m: 0.03
    tracking_error_bound_m: 0.0
    joint_acceleration_limit_radps2: 4.0
    safety_gain: 4.0
    preemptive_margin_m: 0.0
    risk_speed_scaling_enabled: false
    recovery_mode_enabled: false
    recovery_allow_constraint_relaxation: false
    recovery_maximize_min_clearance: false
    diagnostic_logging: true
    max_projection_iterations: 80
    constraint_tolerance: 1.0e-8
    projection_failure_tolerance: 1.0e-6
    active_set_fallback_enabled: true
    active_set_max_candidate_constraints: 12
    fallback_projection_iterations: 640
    use_qp_solver: true
    # This run isolates feasibility and collision behavior, not real-time execution.
    qp_time_limit_s: null
    max_filter_compute_time_s: null
  obstacle:
    speed_range: [0.10, 0.10]

train:
  method: link_fixed

eval:
  method: link_fixed

smoke:
  method: link_fixed

