# P4.2 held-out fixed-actor counterfactual matrix.
# The same selected Instant-Link-SAC actors are evaluated with and without the
# minimal safety QP. No actor is retrained by this experiment.
method: link_fixed

checkpoints:
  101: outputs/archive_pre_restart_2026-09-09/archive_old/link_fixed_penalty1_legacy/train/link_fixed/seed_101/link_fixed_seed101_steps100000/actor_step_100000.pt
  202: outputs/archive_pre_restart_2026-09-09/archive_old/link_fixed_penalty1_legacy/train/link_fixed/seed_202/link_fixed_seed202_steps100000/actor_step_50000.pt
  303: outputs/archive_pre_restart_2026-09-09/archive_old/link_fixed_penalty1_legacy/train/link_fixed/seed_303/link_fixed_seed303_steps100000/actor_step_100000.pt

variants:
  baseline_rtb:
    config: configs/experiments/random_crossing_link_fixed_penalty1_rtb.yaml
  minimal_qp:
    config: configs/experiments/random_crossing_link_fixed_penalty1_minimal_qp.yaml

evaluation:
  seeds: [1004, 1005, 1006]
  episodes_per_seed: 100
  scenarios:
    - random_crossing
    - upper_arm_crossing
    - elbow_crossing
    - forearm_crossing
    - wrist_crossing
  # Keep this corrected run separate from the earlier base_seed+episode run.
  output_root: outputs/archive_pre_restart_2026-09-09/current_results/minimal_qp_heldout_counterfactual_independent_seeds
