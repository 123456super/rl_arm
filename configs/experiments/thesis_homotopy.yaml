includes:
  - ../default.yaml

seed: 11001
device: cuda:auto

robot:
  tool_link_name: wrist_3_link

thesis:
  protocol: task_first_persistent_eta_replay_homotopy_v11
  stage: s0
  physics_dt: 0.004166666666666667
  control_dt: 0.05
  horizon: 240
  action_scale: 0.7
  ee_linear_velocity_scale: 1.0
  ee_angular_velocity_scale: 4.2
  joint_motor_force: 90.0
  obstacle_radius: 0.075
  obstacle_speed: 0.1
  d_safe: 0.12
  # Self-clearance uses the URDF collision meshes.  Capsule-vs-capsule
  # distances are not used here because the wrist capsules overlap in valid
  # configurations.  TTC supplies early warning outside the 5 mm safety margin.
  self_collision:
    safe_distance_m: 0.005
    query_distance_m: 0.25
    ttc_max_s: 3.0
    approach_velocity_scale: 0.7
    ttc_tau_s: 1.0
    curriculum:
      # Dense self-clearance shaping is disabled until the complete pose task
      # passes its online and deterministic retention gates.  Real contact is
      # still a hard terminal failure with a -10 penalty in every phase.
      start_weight: 0.0
      end_weight: 1.0
      ramp_steps: 50000
      full_weight_min_transitions: 25000
  position_tolerance: 0.055
  orientation_tolerance: 0.10
  goal_sample_max_attempts: 10000
  ramp_steps: 50000
  strict_min_transitions: 25000
  goal_curriculum:
    start_scale: 0.03
    end_scale: 1.0
    levels: [0.03, 0.04, 0.05, 0.065, 0.08, 0.10, 0.125, 0.16, 0.20, 0.25, 0.32, 0.40, 0.50, 0.65, 0.82, 1.0]
    min_transitions_per_level: 5000
    success_window: 100
    success_floor: 0.80
    full_scale_min_transitions: 25000
  orientation_curriculum:
    start_scale: 0.0
    end_scale: 1.0
    tolerance_start: 3.141592653589793
    tolerance_end: 0.10
    success_window: 100
    success_floor: 0.80
    levels: [0.0, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.93, 0.96, 0.98, 1.0]
    min_transitions_per_level: 5000
    anchor_probability: 0.25
    anchor_probability_intermediate: 0.40
    anchor_probability_recovery: 0.50
    anchor_success_window: 100
    anchor_success_floor: 0.95
    retention_target: 0.98
    retention_min_observations: 20
    replay_anchor_fraction: 0.25
    replay_current_fraction: 0.50
    replay_anchor_intermediate: 0.40
    replay_current_intermediate: 0.40
    replay_anchor_recovery: 0.50
    replay_current_recovery: 0.35
    # Physical storage is separated from sampling fractions.  A difficult
    # current eta can overwrite only its own FIFO; completed eta levels are
    # frozen into independent snapshots and remain available for rehearsal.
    replay_storage:
      anchor_capacity: 15000
      current_capacity: 30000
      history_capacity_per_level: 3000
    deterministic_probe_required: true
    deterministic_probe_episodes: 50
    deterministic_probe_seed: 31001
    deterministic_probe_success_floor: 0.95
    deterministic_probe_interval_transitions: 5000
    full_scale_min_transitions: 25000
  reward:
    # RFM-inspired bounded pose quality. Position always contributes; the
    # orientation term is multiplicatively gated by position quality.
    position_sigma_m: 0.20
    orientation_sigma_rad: 1.0
    micro_power: 4.0
    orientation_priority_weight: 1.0
    potential_scale: 20.0
    success_bonus: 20.0
    velocity_cost_weight: 0.04
    smooth_cost_weight: 0.01
    hard_failure_penalty: 10.0
    safety_risk_weight: 2.0
    safety_clearance_weight: 8.0
    self_risk_weight: 2.0
    self_clearance_weight: 8.0
    # Risk/clearance are combined as a weighted mean, then scaled.  Thus each
    # dense safety group is bounded to [0, 1] before xi/lambda is applied.
    external_safety_scale: 1.0
    self_safety_scale: 1.0

train:
  # A block is an analysis unit, not a stopping criterion.  Every formal
  # seed/ablation gets the same per-stage hard budget.
  total_steps: 100000
  max_stage_steps: 600000
  save_interval: 25000
  progress_interval: 1000
  plateau:
    comparison_blocks: 2
    min_current_episodes_per_block: 100
    min_anchor_episodes_per_block: 50
    safe_success_delta: 0.02
    self_collision_delta: 0.01
    timeout_delta: 0.02
    anchor_success_delta: 0.01
    probe_success_delta: 0.02
    probe_collision_delta: 0.01
    probe_timeout_delta: 0.02
    q_abs_limit: 1000.0
    critic_loss_limit: 1000.0
    divergence_ratio: 5.0
  # V11 changes replay storage and sampling semantics. Never load V10 artifacts.
  output_dir: outputs/experiments_9/v11

sac:
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0001
  alpha_lr: 0.0003
  batch_size: 256
  warmup_steps: 3000
  update_after: 1000
  hidden_dims: [256, 256]
  initial_alpha: 0.2
  critic_gradient_clip: 10.0
  actor_gradient_clip: 10.0
  actor_update_interval: 2
