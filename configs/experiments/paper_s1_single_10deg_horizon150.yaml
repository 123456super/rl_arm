# S1 residual-policy training with one fixed-size path-blocking static cube.
# All reaching, observation, controller, and PPO contracts are inherited from
# the 10 deg/s S0 configuration; only the task stage and obstacle scene change.
includes:
  - paper_s0_cb31_10deg_horizon150.yaml

thesis:
  stage: s1
  simple_reaching_mode: false
  blocking_obstacle_mode: true
  # Some otherwise valid reaching goals are too short or geometrically
  # crowded to fit a 0.15 m cube directly on the nominal TCP path while also
  # preserving 0.10 m clearance from both endpoint robot configurations.
  # Resample the goal instead of terminating a healthy parallel worker.
  scene_sample_max_attempts: 64
  # Give the 2.5 Hz avoidance policy enough reaction distance at reset and
  # keep the final 25 mm Base handoff region geometrically obstacle-free.
  obstacle_surface_clearance_min_m: 0.10
  static_obstacle_count_probabilities:
    1: 1.0
  static_obstacle_layout_probabilities:
    # Half of the episodes require an actual detour by placing the cube on
    # the nominal TCP path. The other half sample a broad workspace location
    # while preserving endpoint-robot and mounting-plane clearance.
    legacy_blocking: 0.5
    workspace_random: 0.5
  reward:
    # Train the new residual and obstacle-set encoder without a residual-size
    # regularizer or near-goal handover, matching the successful legacy S1
    # training contract.
    reference_residual_penalty_weight: 0.0

train:
  total_steps: 2000000
