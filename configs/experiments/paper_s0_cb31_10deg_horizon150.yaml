# S0 Base-policy training under the faster CB31UR5 control contract.
# The 10 deg/s limit remains conservative relative to the robot capability,
# while reducing the long transit time of the former 7 deg/s policy.
includes:
  - paper_full.yaml

thesis:
  stage: s0
  simple_reaching_mode: true
  blocking_obstacle_mode: false
  control_dt: 0.4
  obstacle_geometry_check_interval_substeps: 96
  horizon: 150
  # 10 deg/s * 0.4 s = 4 deg maximum executable increment per decision.
  joint_delta_limit_rad: 0.06981317007977318
  qdot_observation_scale: 0.17453292519943295
  joint_motion_controller:
    enabled: true
    # Commands are recomputed at the CB3.1 interface rate and held between
    # updates while Bullet continues to integrate at 240 Hz.
    real_control_frequency_hz: 125.0
    joint_velocity_limits_rad_s: [0.17453292519943295, 0.17453292519943295, 0.17453292519943295, 0.17453292519943295, 0.17453292519943295, 0.17453292519943295]
    # Reach 10 deg/s in 0.5 s.
    joint_acceleration_limits_rad_s2: [0.3490658503988659, 0.3490658503988659, 0.3490658503988659, 0.3490658503988659, 0.3490658503988659, 0.3490658503988659]
  reward:
    # Restore the original reference-PPO contract: self-contact remains
    # nonterminal and costs 10 points for each affected 0.4 s decision.
    reference_self_collision_penalty: 10.0

train:
  # Final S0 adaptation budget from the selected 7 deg/s Base.  Optimizers
  # and LR schedules restart over this one-million-transition experiment.
  total_steps: 1000000
  num_envs: 16
  rollout_length: 256
  cpu_ids: [0, 6, 12, 18, 1, 7, 13, 19, 2, 8, 14, 20, 3, 9, 15, 21]
  # The old Base ended at 0.00942 rad mean std. Scaling by 10/7 preserves
  # approximately the same exploration/action-range ratio during adaptation.
  stage_transfer_action_std: 0.0135

ppo:
  # Preserve the stable S0 optimization regime used to obtain the selected
  # 7 deg/s Base; only the physical execution contract and exploration scale
  # change in this adaptation experiment.
  actor_lr: 3.0e-05
  critic_lr: 1.0e-04
  action_std_init: 0.022857142857142857
