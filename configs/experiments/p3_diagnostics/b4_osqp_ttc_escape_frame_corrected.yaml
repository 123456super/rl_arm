# Simulation candidate: corrected collision frames with early TTC escape.
# This remains an offline simulation diagnostic, not a real-time guarantee.
includes:
  - b4_osqp_strict_frame_corrected_heldout.yaml

env:
  safety_filter:
    recovery_mode_enabled: true
    recovery_enter_margin_m: 0.04
    recovery_exit_margin_m: 0.08
    recovery_ttc_threshold_s: 0.15
    recovery_speed_radps: 0.7
    recovery_allow_constraint_relaxation: true
    recovery_maximize_min_clearance: true
    diagnostic_logging: true
    qp_time_limit_s: 0.008
    max_filter_compute_time_s: 0.02

eval:
  method: link_fixed
  episodes: 1
  seed: 6301
