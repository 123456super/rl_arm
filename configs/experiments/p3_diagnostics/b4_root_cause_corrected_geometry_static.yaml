# Root-cause 2x2: final frame-corrected geometry and a static obstacle.
# This differs from the moving condition only in obstacle velocity.
includes:
  - b4_osqp_strict_frame_corrected_heldout.yaml

env:
  safety_filter:
    recovery_mode_enabled: false
    recovery_allow_constraint_relaxation: false
    recovery_maximize_min_clearance: false
  obstacle:
    speed_range: [0.0, 0.0]

eval:
  method: link_fixed
  episodes: 20
