# Fresh S0 Base training for the revised installation-safe task geometry.
# The fixed initial posture uses clean 10-degree increments, and the target
# orientation is the nearby rounded pose validated over the sampled workspace.
includes:
  - paper_s0_cb31_10deg_horizon150.yaml

thesis:
  fixed_orientation_goal:
    enabled: true
    # [-170, 30, 95] degrees.
    euler_rad: [-2.9670597283903604, 0.5235987755982988, 1.6580627893946132]
    # [60, -90, 90, -60, -100, -120] degrees.
    initial_joint_positions_rad:
      [1.0471975511965976, -1.5707963267948966, 1.5707963267948966, -1.0471975511965976, -1.7453292519943295, -2.0943951023931953]

train:
  total_steps: 5000000
  num_envs: 16
  rollout_length: 256

ppo:
  # This is a fresh task rather than a small 7-to-10 deg/s adaptation. Use the
  # stable from-scratch reference-PPO initialization and decay over all 5M
  # transitions. Actor std adaptation still protects the narrow late policy.
  actor_lr: 3.0e-04
  critic_lr: 3.0e-04
  action_std_init: 0.08
  actor_lr_min: 1.0e-05
