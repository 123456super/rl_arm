# S1 geometry-domain-randomization continuation.
# Preserve the learned 1--5 obstacle count and layout mixtures while adding
# moderate OBB size/aspect-ratio variation as a separate training stage.
includes:
  - paper_s1_layout_rich_1_5.yaml

thesis:
  # Independently sample each half extent in [0.05, 0.10] m.  Resulting full
  # dimensions span 0.10--0.20 m and aspect ratios up to 2:1.  The previously
  # trained 0.15 m cube lies in the middle of this distribution.
  obstacle_half_extents_min_m: [0.05, 0.05, 0.05]
  obstacle_half_extents_max_m: [0.10, 0.10, 0.10]

  # Larger OBBs require slightly wider structured offsets to keep dense
  # five-obstacle layouts feasible without changing the 5 cm surface gap.
  structured_offset_min_m: 0.20
  structured_offset_max_m: 0.32
