# S1 layout-domain-randomization continuation.
# Keep obstacle count, geometry, reward, and policy semantics fixed while
# broadening only the static placement distribution.
includes:
  - paper_full.yaml

thesis:
  stage: s1
  simple_reaching_mode: false
  blocking_obstacle_mode: true
  static_obstacle_count_probabilities:
    1: 0.2
    2: 0.2
    3: 0.2
    4: 0.2
    5: 0.2

  static_obstacle_layout_probabilities:
    legacy_blocking: 0.30
    path_offset: 0.30
    mixed: 0.25
    structured: 0.15

  # Layout randomization only: obstacle size remains the fixed 0.15 m cube.
  # Signed robot-surface clearance from the nominal swept path.
  path_offset_min_m: 0.03
  path_offset_max_m: 0.15
  obstacle_surface_clearance_min_m: 0.05
  structured_offset_min_m: 0.18
  structured_offset_max_m: 0.28

  reward:
    # Full residual policy, with no 25 mm handover or residual regularizer.
    reference_residual_penalty_weight: 0.0
