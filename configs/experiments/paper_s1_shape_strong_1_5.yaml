# S1 stronger geometry-domain-randomization continuation.
# Keep the learned 1--5 obstacle count/layout distributions and broaden only
# the OBB dimensions, so the effect of stronger shape variation is isolated.
includes:
  - paper_s1_shape_rich_1_5.yaml

thesis:
  # Independently sampled half extents give full dimensions of 0.08--0.24 m
  # and a maximum axis aspect ratio of 3:1. The preceding 0.10--0.20 m
  # distribution remains inside this range, avoiding an abrupt domain shift.
  obstacle_half_extents_min_m: [0.04, 0.04, 0.04]
  obstacle_half_extents_max_m: [0.12, 0.12, 0.12]

  # Allow enough placement room for dense five-obstacle layouts while
  # retaining the existing minimum surface-clearance constraint.
  structured_offset_min_m: 0.24
  structured_offset_max_m: 0.38
