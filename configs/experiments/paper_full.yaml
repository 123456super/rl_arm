# Reference PPO obstacle-free reaching experiment.
includes:
  - ../default.yaml

seed: 11001
device: cuda:auto

robot:
  tool_link_name: wrist_3_link

thesis:
  protocol: reference_ppo_reaching
  simple_reaching_mode: true
  blocking_obstacle_mode: false
  stage: s0
  physics_dt: 0.004166666666666667
  control_dt: 0.4166666666666667
  horizon: 100
  action_limit_rad: 3.14
  joint_target_margin_rad: 0.02
  joint_limit_tolerance_rad: 0.001
  qdot_observation_scale: 0.8
  success_hold_steps: 1
  ee_linear_velocity_scale: 0.55
  ee_angular_velocity_scale: 1.5
  joint_motor_force: 90.0
  obstacle_radius: 0.075
  obstacle_speed: 0.1
  d_safe: 0.05
  position_tolerance: 0.01
  orientation_tolerance: 0.1
  goal_sample_max_attempts: 10000

  fixed_orientation_goal:
    enabled: true
    euler_rad: [0.0, 1.57, 1.57]
    initial_joint_positions_rad:
      [0.7853981633974483, -1.5707963267948966, 1.5707963267948966, 0.0, 0.7853981633974483, -1.5707963267948966]

  reference_ppo:
    success_threshold: 1.0e-4
    gravity: [0.0, 0.0, -10.0]
    motor_forces: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]
    mounting_plane:
      enabled: true
      height_m: 0.0
      ignored_link_names: [base_link, base_link_inertia]

  self_collision:
    safe_distance_m: 0.005
    query_distance_m: 0.25
    ttc_max_s: 3.0
    approach_velocity_scale: 0.7
    ttc_tau_s: 1.0

  self_safety_projection:
    enabled: false
    activation_distance_m: 0.05
    gain: 5.0
    fd_epsilon: 0.001
    max_iterations: 16
    eps: 1.0e-08
    violation_tolerance: 1.0e-06

  joint_pose_curriculum:
    task_space_sampling:
      balanced_bins: false
      position_bins: 10
      orientation_bins: 10
      reset_max_attempts: 32

  reward:
    reward_mode: reference_ppo
    reference_obstacle_threshold_m: 0.08
    reference_collision_penalty: 1.0

  observation:
    reference_point_offset_m: 0.001

train:
  cpu_affinity: false
  total_steps: 1500000
  max_stage_steps: 1500000
  num_envs: 8
  save_interval: 25000
  progress_interval: 1000
  log_flush_interval: 100
  update_log_interval: 10
  output_dir: outputs/ppo

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.20
  epochs: 20
  minibatch_size: 1024
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  entropy_coef: 0.01
  value_coef: 1.0
  normalize_advantage: false
  max_grad_norm: null
  target_kl: null
  max_abs_log_ratio: 20.0
  action_std_init: 1.0
  lr_decay: true
  actor_lr_final: 0.0
  critic_lr_final: 0.0
  adaptive_kl_lr: false
  hidden_dims: [256, 256]
