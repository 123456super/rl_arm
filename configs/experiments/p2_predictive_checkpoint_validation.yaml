    config: configs/experiments/random_crossing_predictive_link_30k_tuned.yaml
    checkpoints:
      101: outputs/archive_old/predictive_link_incomplete/predictive_link_tuned_h0p5_seed101_steps30000/actor_step_10000.pt
  predictive_h0p5_step20k:
