    checkpoints:
      101: outputs/archive_old/predictive_link_incomplete/predictive_link_tuned_h0p5_compact_seed101_steps30000/actor_step_20000.pt
  predictive_compact_step30k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_tuned_compact.yaml
    checkpoints:
