# S1 continuation: equal mixture of one and two fixed-size blocking cubes.
includes:
  - paper_full.yaml

thesis:
  stage: s1
  simple_reaching_mode: false
  blocking_obstacle_mode: true
  static_obstacle_count_probabilities:
    1: 0.5
    2: 0.5
  reward:
    # Keep the residual policy active throughout obstacle episodes.  This
    # experiment does not use the 25 mm hard handover or near-goal soft
    # residual regularization.
    reference_residual_penalty_weight: 0.0
