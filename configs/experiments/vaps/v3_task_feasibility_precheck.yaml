# VAPS task-feasibility precheck. Offline labels only; this is not a training config.
includes:
  - v2_g2_strict_execution.yaml

precheck:
  protocol: vaps_task_feasibility_precheck_v1
  ik_attempts: 32
  ik_position_tolerance_m: 0.005
  path_dt_s: 0.05
