# Independent V0 reaching-recovery protocol. This deliberately does not modify
# the frozen P3/VAPS safety-control branches.
includes:
  - ../../default.yaml

device: cuda

env:
  obstacle:
    enabled: false
  safety_filter:
    enabled: false
    viability_monitor_enabled: false
    diagnostic_logging: false
    recovery_mode_enabled: false
    recovery_allow_constraint_relaxation: false
    recovery_maximize_min_clearance: false

risk:
  representation: current

sac:
  fixed_risk_penalty: 0.0

train:
  method: link_fixed
  total_steps: 200000
  progress_interval: 500
  log_interval: 10
  save_interval: 20000
  output_dir: outputs/reaching_recovery_v1/train
  run_name: null

checkpoint_selection:
  episodes: 40
  metric: success_rate
  seed_manifest: configs/experiments/reaching_recovery/manifests/v1_validation.json

eval:
  method: link_fixed
  episodes: 200
  seed_manifest: configs/experiments/reaching_recovery/manifests/v1_final.json

