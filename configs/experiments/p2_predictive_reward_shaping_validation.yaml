# P2.2 dense predictive reward validation on seed 2001. Compare the two
# shaping weights/checkpoints with matched Instant-Link and unshaped Predictive.
evaluation:
  seeds: [2001]
  episodes_per_seed: 100
  scenarios: [random_crossing]
  output_root: outputs/current_results/p2_predictive_reward_shaping_validation

variants:
  instant_link_step30k:
    method: link_fixed
    config: configs/experiments/random_crossing_link_fixed_penalty1.yaml
    checkpoints:
      101: outputs/archive_old/link_fixed_penalty1_legacy/train/link_fixed/seed_101/link_fixed_seed101_steps100000/actor_step_30000.pt
  predictive_unshaped_step30k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_tuned.yaml
    checkpoints:
      101: outputs/archive_old/predictive_link_incomplete/predictive_link_tuned_h0p5_seed101_steps30000/actor_step_30000.pt
  predictive_reward0p1_step10k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_reward0p1.yaml
    checkpoints:
      101: outputs/current_results/p2_predictive_reward_shaping/train/predictive_h0p5_reward0p1_seed101_steps30000/actor_step_10000.pt
  predictive_reward0p1_step20k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_reward0p1.yaml
    checkpoints:
      101: outputs/current_results/p2_predictive_reward_shaping/train/predictive_h0p5_reward0p1_seed101_steps30000/actor_step_20000.pt
  predictive_reward0p1_step30k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_reward0p1.yaml
    checkpoints:
      101: outputs/current_results/p2_predictive_reward_shaping/train/predictive_h0p5_reward0p1_seed101_steps30000/actor_step_30000.pt
  predictive_reward0p25_step10k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_reward0p25.yaml
    checkpoints:
      101: outputs/current_results/p2_predictive_reward_shaping/train/predictive_h0p5_reward0p25_seed101_steps30000/actor_step_10000.pt
  predictive_reward0p25_step20k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_reward0p25.yaml
    checkpoints:
      101: outputs/current_results/p2_predictive_reward_shaping/train/predictive_h0p5_reward0p25_seed101_steps30000/actor_step_20000.pt
  predictive_reward0p25_step30k:
    method: predictive_link
    config: configs/experiments/random_crossing_predictive_link_30k_reward0p25.yaml
    checkpoints:
      101: outputs/current_results/p2_predictive_reward_shaping/train/predictive_h0p5_reward0p25_seed101_steps30000/actor_step_30000.pt
