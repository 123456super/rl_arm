# Targeted feasibility candidate for raw goal-reachable but obstacle-blocked
# IK resets.  The beam searches redundant exact-target configurations before
# the existing fallback chain.  All task, d_safe, collision, horizon, state
# machine, filter and success semantics are inherited from t005 unchanged.
includes:
  - s1_static_revised_recovery_gated_goal_velocity_temporal_consistency_t005_hard_cases_v1.yaml

architecture_version: hierarchical_s1_revised_ik_obstacle_aware_beam_targeted_v1

env:
  hierarchical_control:
    architecture_version: hierarchical_s1_revised_ik_obstacle_aware_beam_targeted_v1
    parent_architecture: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_t005_hard_cases_v1
    planner:
      ik_obstacle_aware_beam_enabled: true
      ik_obstacle_aware_beam_width: 16
      ik_obstacle_aware_beam_iterations: 20
      ik_obstacle_aware_beam_seed_limit: 12
      ik_obstacle_aware_beam_step_rad: 0.08
      ik_obstacle_aware_beam_finite_difference_rad: 0.02
      ik_obstacle_aware_beam_gradient_gain: 1.0
      ik_obstacle_aware_beam_damping: 0.08

train:
  output_dir: outputs/hierarchical/s1_static_revised_ik_obstacle_aware_beam_targeted_v1

eval:
  seed_manifest: configs/experiments/reaching_recovery/manifests/v1_hierarchical_goal_region_expanded_cases.json
  nominal_only: true
