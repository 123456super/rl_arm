# Conservative temporal-consistency diagnostic.  Compared with the validated
# 9027 smoke candidate, only the secondary LP near-optimal band is tightened
# from 0.02 m/s to 0.005 m/s, preserving more primary goal velocity.
includes:
  - s1_static_revised_recovery_gated_goal_velocity_temporal_consistency_9027_v1.yaml

architecture_version: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_t005_9027_v1

env:
  hierarchical_control:
    architecture_version: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_t005_9027_v1
    parent_architecture: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_9027_v1
  safety_filter:
    goal_velocity_near_optimal_tolerance_mps: 0.005

train:
  output_dir: outputs/hierarchical/s1_static_revised_recovery_gated_goal_velocity_temporal_consistency_t005_9027_v1

eval:
  seed_manifest: configs/experiments/reaching_recovery/manifests/v1_hierarchical_temporal_consistency_9027.json
  nominal_only: true
