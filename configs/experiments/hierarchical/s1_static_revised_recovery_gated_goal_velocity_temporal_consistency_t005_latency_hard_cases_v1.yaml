architecture_version: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_t005_latency_hard_cases_v1

env:
  hierarchical_control:
    architecture_version: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_t005_latency_hard_cases_v1
    parent_architecture: hierarchical_s1_revised_recovery_gated_goal_velocity_temporal_consistency_t005_hard_cases_v1
  safety_filter:
    goal_velocity_priority_require_nonzero_request: true

train:
