architecture_version: hierarchical_s1_static_revised_ik_goal_region_t005_terminal_priority_smoke_v1

env:
  hierarchical_control:
    architecture_version: hierarchical_s1_static_revised_ik_goal_region_t005_terminal_priority_smoke_v1
    parent_architecture: hierarchical_s1_static_revised_ik_goal_region_t005_clearance_retain_terminal_hard_cases_v1
  safety_filter:
    goal_velocity_priority_for_goal_region: true

train:
