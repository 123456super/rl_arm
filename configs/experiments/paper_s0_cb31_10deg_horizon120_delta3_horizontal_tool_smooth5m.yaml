# Complete S0 Base experiment with the tool0 XY plane parallel to the mounting
# plane. tool0 +Z points vertically downward; yaw=90 degrees fixes the in-plane
# heading. Keep all experiment-specific control, smoothing, PPO and runtime
# settings here so the active S0 configuration has no intermediate inheritance.
includes:
  - paper_full.yaml

thesis:
  stage: s0
  simple_reaching_mode: true
  blocking_obstacle_mode: false
  control_dt: 0.4
  obstacle_geometry_check_interval_substeps: 96
  horizon: 120
  joint_delta_limit_rad: 0.05235987755982989  # 3 degrees
  qdot_observation_scale: 0.17453292519943295

  fixed_orientation_goal:
    enabled: true
    # [roll, pitch, yaw] = [-180, 0, 90] degrees.  This makes the tool0 XY
    # plane horizontal and its +Z normal point toward the mounting plane.
    euler_rad:
      [-3.141592653589793, 0.0, 1.5707963267948966]
    # Collision-free horizontal-tool initial pose:
    # [60, -90, 90, -90, -90, -120] degrees.
    initial_joint_positions_rad:
      [1.0471975511965976, -1.5707963267948966, 1.5707963267948966, -1.5707963267948966, -1.5707963267948966, -2.0943951023931953]

  joint_motion_controller:
    enabled: true
    robot_generation: ur5_cb3_1
    real_control_frequency_hz: 125.0
    joint_velocity_limits_rad_s:
      [0.17453292519943295, 0.17453292519943295, 0.17453292519943295, 0.17453292519943295, 0.17453292519943295, 0.17453292519943295]
    joint_acceleration_limits_rad_s2:
      [0.3490658503988659, 0.3490658503988659, 0.3490658503988659, 0.3490658503988659, 0.3490658503988659, 0.3490658503988659]
    trajectory_smoothing:
      enabled: true
      # 0.50 Hz retains slightly more responsiveness than the paper-equivalent
      # normalized cutoff of approximately 0.40 Hz at our 2.5 Hz policy rate.
      butterworth_cutoff_hz: 0.5
      # Blend one policy decision over its 0.4 s execution interval at 125 Hz.
      quintic_blend_duration_s: 0.4

  reward:
    reference_self_collision_penalty: 10.0

train:
  total_steps: 5000000
  num_envs: 16
  rollout_length: 256
  cpu_ids: [0, 6, 12, 18, 1, 7, 13, 19, 2, 8, 14, 20, 3, 9, 15, 21]

ppo:
  actor_lr: 3.0e-04
  critic_lr: 3.0e-04
  # Preserve the previous 4-degree experiment's exploration-to-action ratio:
  # 0.08 rad * (3/4) = 0.06 rad.
  action_std_init: 0.06
  actor_lr_min: 1.0e-05
