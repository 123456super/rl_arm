# P3 B1: end-effector current-distance fixed-penalty SAC development baseline.
includes:
  - ../p3_unified_geometry/b4_fixed_obstacle005_robot100_base.yaml

seed: 4101

risk:
  representation: current

sac:
  fixed_risk_penalty: 1.0

env:
  safety_filter:
    enabled: false

train:
  method: ee_fixed
  total_steps: 10000
  save_interval: 5000
  output_dir: outputs/p3_postfix_dev/b1_ee_current

checkpoint_selection:
  seed: 5201
  episodes: 20
  metric: mean_reward

eval:
  method: ee_fixed
  episodes: 20
  seed: 5101

smoke:
  method: ee_fixed
