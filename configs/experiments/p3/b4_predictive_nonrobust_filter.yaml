# P3 B4: predicted-distance SAC with a non-robust predictive safety filter.
includes:
  - ../../default.yaml

seed: 4101

risk:
  representation: predictive

sac:
  fixed_risk_penalty: 1.0

env:
  collision:
    termination: physical_contact
  safety_filter:
    enabled: true
    control_delay_s: 0.0
    geometry_margin_m: 0.0
    tracking_error_bound_m: 0.0
    projection_failure_tolerance: 1.0e-6

train:
  method: link_fixed
  total_steps: 10000
  save_interval: 5000
  output_dir: outputs/p3_postfix_dev/b4_predictive_nonrobust_filter

eval:
  method: link_fixed
  episodes: 20
  seed: 5101

smoke:
  method: link_fixed
