# P3 B5: uncertainty-margin predicted-distance SAC with the robust safety filter.
includes:
  - ../../default.yaml

seed: 4101

risk:
  representation: robust_predictive

sac:
  fixed_risk_penalty: 1.0

env:
  safety_filter:
    enabled: true
    control_delay_s: 0.05
    geometry_margin_m: 0.0
    tracking_error_bound_m: 0.01

train:
  method: link_fixed
  total_steps: 10000
  save_interval: 5000
  output_dir: outputs/p3_dev/b5_robust_predictive_filter

eval:
  method: link_fixed
  episodes: 20
  seed: 5101

smoke:
  method: link_fixed
