# P3 B2: link-level current-distance fixed-penalty SAC development baseline.
includes:
  - ../../default.yaml

seed: 4101

risk:
  representation: current

sac:
  fixed_risk_penalty: 1.0

env:
  collision:
    termination: physical_contact

train:
  method: link_fixed
  total_steps: 10000
  save_interval: 5000
  output_dir: outputs/p3_postfix_dev/b2_link_current

eval:
  method: link_fixed
  episodes: 20
  seed: 5101

smoke:
  method: link_fixed
