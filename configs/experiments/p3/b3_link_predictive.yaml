# P3 B3: link-level predicted-distance fixed-penalty SAC without a safety filter.
includes:
  - ../p3_unified_geometry/b4_fixed_obstacle005_robot100_base.yaml

seed: 4101

risk:
  representation: predictive

sac:
  fixed_risk_penalty: 1.0

env:
  safety_filter:
    enabled: false

train:
  method: link_fixed
  total_steps: 10000
  save_interval: 5000
  output_dir: outputs/p3_postfix_dev/b3_link_predictive

checkpoint_selection:
  seed: 5201
  episodes: 20
  metric: mean_reward

eval:
  method: link_fixed
  episodes: 20
  seed: 5101

smoke:
  method: link_fixed
