# PyBullet 环境与任务配置。该文件只放仿真、任务、目标和障碍物场景参数。
env:
  # 是否打开 PyBullet GUI。服务器或批量实验应保持 false。
  gui: false
  # 仿真重力。本文固定基座速度控制任务默认设为零重力，避免重力动力学干扰避障策略原型。
  gravity: [0.0, 0.0, 0.0]
  # PyBullet 物理步长，0.0041666667 约等于 240 Hz。
  time_step: 0.0041666667
  # 策略控制周期，0.05 表示 20 Hz。环境会在一个控制周期内执行多个物理子步。
  control_dt: 0.05
  # 单个 episode 的最大控制步数。
  max_episode_steps: 240
  # 策略输出 [-1, 1] 映射到关节速度后的最大绝对速度，单位 rad/s。
  action_scale: 0.7
  # 旧的一阶 EMA 固定平滑系数；fixed_smoothing_mode=ema 时生效，也保留为观察兼容占位量。
  fixed_beta: 0.35
  # 末端位置到达判定阈值，单位 m；还需要 d_min > d_safe 才算成功。
  success_tolerance: 0.055

  # 目标和障碍物采样的工作空间范围，单位 m。
  workspace:
    x: [0.25, 0.78]
    y: [-0.45, 0.45]
    z: [0.18, 0.78]

  # observation 中若干连续特征的归一化/裁剪参数。
  observation:
    # Observation contract identifier. Changing feature order or meaning requires a new version and retraining.
    schema_version: link_risk_v1
    # Gym observation_space 的统一上下界；真实特征仍在构造 observation 时单独归一化/裁剪。
    space_bound: 10.0
    # 连杆表面距离进入 observation 前的裁剪范围。
    distance_clip: [-1.0, 1.5]
    # 无障碍物场景下写入风险距离特征的安全占位距离。
    no_obstacle_distance: 1.5
    # 预测风险的统一默认值。实验配置只覆盖真正变化的字段。
    predictive_risk:
      horizon: 1.0
      step: 0.05
      w_min_distance: 0.55
      w_enter_time: 0.30
      w_approach: 0.15
      include_per_link_score: true

  # 执行层参数。
  execution:
    # PyBullet 速度控制的关节最大驱动力，单位 N*m。过小可能跟不上速度命令，过大可能使仿真过硬。
    joint_motor_force: 90.0
    # Maximum joint-velocity policy change per policy cycle (rad/s), following the paper's action-rate constraint.
    # Set to null only when reproducing historical checkpoints trained without this limiter.
    max_policy_velocity_delta: 0.1
    # 固定平滑执行器：butterworth_quintic 为论文式两级 RTB；ema 保留为旧实验消融基线。
    fixed_smoothing_mode: butterworth_quintic
    rtb:
      # Butterworth 截止角频率，单位 rad/s；论文采用 30。
      cutoff_angular_frequency: 30.0
    # Safety-QP 的完整默认配置集中在 YAML，运行代码不再提供隐式数值默认值。
    safety_qp:
      enabled: false
      activation_distance: 0.24
      gain: 3.0
      fd_epsilon: 0.001
      max_iterations: 8
      eps: 1.0e-8
      violation_tolerance: 1.0e-6
      trajectory_mode: post_qp_rtb
      motion_bounds:
        max_acceleration: null
        max_jerk: null

  # 可视化参数，只影响 GUI/渲染显示，不参与训练逻辑。
  visual:
    floor_position: [0.0, 0.0, -0.005]
    floor_rgba: [0.82, 0.84, 0.86, 1.0]
    obstacle_rgba: [0.95, 0.16, 0.12, 1.0]
    goal_marker_radius: 0.035
    goal_rgba: [0.12, 0.64, 0.28, 0.75]

  obstacle:
    # 是否启用动态球形障碍物。false 用于无障碍基础到达能力检查。
    enabled: true
    # 障碍物场景。random 为随机穿越；也可设为 upper_arm_crossing、elbow_crossing、forearm_crossing、wrist_crossing。
    scenario: random
    # Number of spherical obstacles generated by the scene provider. The default training setup keeps this at 1
    # to preserve the link_risk_v1 observation schema.
    count: 1
    # 每个 episode 启用障碍物的概率；1.0 表示始终启用。
    episode_enable_probability: 1.0
    # 球形障碍物半径，单位 m。
    radius: 0.07
    # 障碍物速度随机范围，单位 m/s。
    speed_range: [0.12, 0.38]
    # disabled 时的障碍物占位位置，应远离机械臂工作空间。
    disabled_position: [10.0, 10.0, 10.0]
    # 障碍物运动反弹边界，避免随机轨迹无限离开工作空间。
    bounds:
      x: [0.25, 0.78]
      y: [-0.7, 0.7]
      z: [0.08, 0.85]
    # random 场景的起点/目标采样范围。
    random:
      x_range: [0.22, 0.72]
      z_range: [0.18, 0.62]
      start_y_abs_range: [0.42, 0.62]
      target_y_abs_range: [0.24, 0.48]
    # 受控场景用于后续公平测试，让障碍物重点靠近指定非末端连杆区域。
    scenarios:
      upper_arm_crossing:
        x_range: [0.35, 0.62]
        z_range: [0.48, 0.52]
        start_y_abs: 0.58
        target_y_abs: 0.38
      elbow_crossing:
        x_range: [0.35, 0.62]
        z_range: [0.42, 0.46]
        start_y_abs: 0.58
        target_y_abs: 0.38
      forearm_crossing:
        x_range: [0.35, 0.62]
        z_range: [0.34, 0.40]
        start_y_abs: 0.58
        target_y_abs: 0.38
      wrist_crossing:
        x_range: [0.35, 0.62]
        z_range: [0.26, 0.32]
        start_y_abs: 0.58
        target_y_abs: 0.38

  goal:
    # static preserves the current reaching task; linear_bounce enables the paper-style moving-target interface.
    mode: static
    # true 时使用固定目标点；false 时在 workspace 内随机采样。
    fixed: false
    # fixed=true 时使用的目标点，单位 m。
    position: [0.55, 0.18, 0.36]
    # Used only by linear_bounce, in m/s.
    speed_range: [0.02, 0.08]
