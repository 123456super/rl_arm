# Shared R2 nominal-policy contract. This is a fresh configuration; no archived
# checkpoint or archived output path is referenced. Candidate files must set the
# fixed-risk weight explicitly.
includes:
  - ../default.yaml

# Expensive formal training must fail loudly rather than silently fall back to CPU.
device: cuda
device_selection:
  fallback_to_cpu: false

env:
  time_step: 0.0041666667
  control_dt: 0.05
  max_episode_steps: 240
  action_scale: 0.7
  observation:
    schema_version: link_risk_v1
  execution:
    max_policy_velocity_delta: 0.1
    fixed_smoothing_mode: butterworth_quintic
    rtb:
      cutoff_angular_frequency: 30.0
    safety_qp:
      enabled: false
  obstacle:
    enabled: true
    scenario: random
    count: 1

risk:
  weights:
    distance: 0.5
    velocity: 0.2
    ttc: 0.3

train:
  method: link_fixed
  total_steps: 100000
  save_interval: 10000
  progress_interval: 100
  output_dir: outputs/restart_2026-09-09/r2_instant_link/train
  run_name: null

eval:
  method: link_fixed
