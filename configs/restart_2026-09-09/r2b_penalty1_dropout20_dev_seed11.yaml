includes:
  - r2_instant_link_base.yaml

# R2a showed that the actor never encountered the no-obstacle placeholder
# observation.  R2b changes only episode coverage: 20% of training episodes
# have no obstacle, while the remaining 80% retain the frozen random crossing.
seed: 11
sac:
  fixed_risk_penalty: 1.0
env:
  obstacle:
    episode_enable_probability: 0.8
train:
  output_dir: outputs/restart_2026-09-09/r2b_obstacle_dropout/train
  run_name: penalty1_dropout20_dev_seed11_steps100000
